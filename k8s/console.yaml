---
# Console API — the browser-facing surface (:8000) and the authority service (:8001)
# run from the SAME image with different commands, per docker-compose.yml.
#
# Persistence: SQLite + WAL with one file per deployable (ADR-002), so both
# containers share a single ReadWriteOnce PVC.
#
# Chain: the compose stack runs Anvil locally. In k3s we cannot, so
# BURSAR_CHAIN/RPC_URL point at a public Base Sepolia endpoint (read-only
# settlement view). The demo settles on the authority ledger, not on-chain.

# ── Console API ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bursar-console
  namespace: bursar
spec:
  replicas: 1
  # SQLite on a RWO volume: never run two writers at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bursar-console
  template:
    metadata:
      labels:
        app: bursar-console
    spec:
      containers:
        - name: console
          image: bursar-backend:latest
          imagePullPolicy: IfNotPresent
          # Mirrors compose: source the addresses the contracts job wrote, then start.
          command:
            - sh
            - -c
            - |
              set -a
              [ -f /shared/chain.env ] && . /shared/chain.env
              set +a
              exec uvicorn src.apps.console_api.app:app --host 0.0.0.0 --port 8000
          ports:
            - containerPort: 8000
          env:
            - name: BURSAR_ENV
              value: prod
            - name: BURSAR_LOG_LEVEL
              value: INFO
            - name: BURSAR_LOG_JSON
              value: "true"
            # SQLite paths inside the shared volume
            - name: BURSAR_CONSOLE_DATABASE_URL
              value: sqlite+aiosqlite:////data/bursar.db
            - name: BURSAR_AUTHORITY_DATABASE_URL
              value: sqlite+aiosqlite:////data/bursar.db
            - name: BURSAR_SQLITE_BUSY_TIMEOUT_MS
              value: "5000"
            # Without `live` the console composes STUB adapters (console/interfaces/api.py:
            # build_deps), so it never calls the real authority and dispatch cannot find the
            # intent it just created. The local .env.demo sets this; k8s did not.
            - name: BURSAR_CONSOLE_UPSTREAM
              value: live
            - name: BURSAR_PRECONDITION_URL
              value: http://bursar-authority:8001/v1/precondition/check
            - name: BURSAR_RIGORIX_SANDBOX
              value: container
            # Owner identity (ADR-005) — demo Anvil account 0
            - name: BURSAR_OWNER_ADDRESS
              value: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
            - name: BURSAR_HOUSEHOLD_ID
              value: demo-household
            # Chain: public Base Sepolia (read-only; no local Anvil in k3s)
            - name: BURSAR_CHAIN
              value: anvil
            - name: BURSAR_RPC_URL
              value: http://bursar-anvil:8545
            - name: BURSAR_CHAIN_ID
              value: "31337"
            - name: BURSAR_CONFIRMATIONS_REQUIRED
              value: "1"
            # Spend guard (ADR-006)
            - name: BURSAR_DAILY_CAP_USDC
              value: "150"
            - name: BURSAR_PER_PAYMENT_THRESHOLD_USDC
              value: "25"
            - name: BURSAR_SETTLEMENT_BUDGET_USDC
              value: "20"
            # Evidence anchoring
            - name: BURSAR_ANCHOR_MODE
              value: per_envelope
            # The authority service, same pod network
            # The agent pipeline calls the authority service directly (separate pod),
            # not just the precondition URL. Without this it defaults to
            # http://127.0.0.1:8001 and every /v1/agent/run fails with ConnectError.
            - name: BURSAR_CONSOLE_AUTHORITY_URL
              value: http://bursar-authority:8001
            - name: AGENT_CONSOLE_URL
              value: http://127.0.0.1:8000
            - name: BURSAR_PRECONDITION_URL
              value: http://bursar-authority:8001/v1/precondition/check
            - name: BURSAR_PRECONDITION_TIMEOUT_SECONDS
              value: "5"
            # Rigorix is not deployed alongside this demo; the console degrades
            # to its local parser/gate when the base URL is unreachable.
            - name: BURSAR_RIGORIX_BASE_URL
              value: http://rigorix-core.rigorix.svc.cluster.local:3000
            - name: BURSAR_RIGORIX_API_KEY
              value: "change-me-to-a-random-32-byte-key"
            - name: BURSAR_RIGORIX_RUN_TEMPLATE
              value: bursar-payment-dispatch
            - name: BURSAR_RIGORIX_RPC_TIMEOUT_SECONDS
              value: "30"
            # OpenRouter (from the bursar-llm secret created out-of-band)
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bursar-llm
                  key: LLM_API_KEY
                  optional: true
            - name: LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: bursar-llm
                  key: LLM_BASE_URL
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: bursar-llm
                  key: LLM_MODEL
                  optional: true
            - name: LLM_FALLBACK_MODEL
              valueFrom:
                secretKeyRef:
                  name: bursar-llm
                  key: LLM_FALLBACK_MODEL
                  optional: true
            # Operator-held key (ADR-007)
            # See authority.yaml: single-database deployment.
            - name: BURSAR_BILLING_READ_MODE
              value: shared
            - name: BURSAR_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: bursar-secrets
                  key: BURSAR_HMAC_KEY
            - name: BURSAR_SETTLEMENT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: bursar-secrets
                  key: BURSAR_SETTLEMENT_PRIVATE_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shared
              mountPath: /shared
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bursar-data
        - name: shared
          persistentVolumeClaim:
            claimName: bursar-data

---
apiVersion: v1
kind: Service
metadata:
  name: bursar-console
  namespace: bursar
spec:
  selector:
    app: bursar-console
  ports:
    - port: 8000
      targetPort: 8000
