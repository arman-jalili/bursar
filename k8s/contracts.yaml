---
# Contract deployment — the k8s equivalent of compose's one-shot `contracts` service.
#
# Deploys TestUsdc + PaymentRouter to the local Anvil and writes the resulting
# addresses to /shared/chain.env. The console and authority read that file
# (see the `set -a; . /shared/chain.env` in their compose commands), so they
# pick up real addresses instead of 0x0.
#
# Runs on every Anvil start, because Anvil keeps state in RAM: a new pod means
# a new empty chain and stale addresses in the old chain.env.
apiVersion: batch/v1
kind: Job
metadata:
  name: bursar-contracts
  namespace: bursar
spec:
  # Anvil state dies with its pod; do not keep a completed job around pretending otherwise.
  ttlSecondsAfterFinished: 600
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: bursar-contracts
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Wait for the chain to answer before deploying to it.
        - name: wait-for-anvil
          image: ghcr.io/foundry-rs/foundry:stable
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                if cast chain-id --rpc-url http://bursar-anvil:8545 >/dev/null 2>&1; then
                  echo "anvil ready"; exit 0
                fi
                sleep 2
              done
              echo "anvil never became ready"; exit 1
      containers:
        - name: deploy
          image: bursar-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - scripts/deploy_contracts.py
          env:
            - name: BURSAR_RPC_URL
              value: http://bursar-anvil:8545
            - name: BURSAR_CHAIN_ID
              value: "31337"
            # Anvil account 1 — the settlement operator (same key as the secret).
            - name: BURSAR_SETTLEMENT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: bursar-secrets
                  key: BURSAR_SETTLEMENT_PRIVATE_KEY
            # Anvil account 0 — the household owner (router owner, never sends a tx).
            - name: BURSAR_OWNER_ADDRESS
              value: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: bursar-data
