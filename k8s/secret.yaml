---
# Secrets for the Bursar stack.
#
# Replace every `change-me` value before exposing this publicly, then apply with:
#   kubectl apply -f k8s/secret.yaml
#
#   openssl rand -hex 32   # for BURSAR_HMAC_KEY
#
# The LLM key (OpenRouter) is NOT here — it is supplied out-of-band:
#   kubectl create secret generic bursar-llm -n bursar \
#     --from-literal=LLM_API_KEY=sk-or-v1-...
apiVersion: v1
kind: Secret
metadata:
  name: bursar-secrets
  namespace: bursar
type: Opaque
stringData:
  # Operator-held evidence signing key (ADR-007). Must never reach an agent workspace.
  BURSAR_HMAC_KEY: "change-me-operator-held-evidence-key"
  # Bearer token the console UI ships in its bundle (demo value, public by design).
  OWNER_TOKEN: "demo-owner-token"
  # Demo settlement wallet (Anvil account 1). NEVER a funded mainnet key.
  BURSAR_SETTLEMENT_PRIVATE_KEY: "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
