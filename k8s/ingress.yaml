---
# Ingress for bursar.rigorix.eu.
#
# Separate from the rigorix-ingress in the `rigorix` namespace so the demo can
# be taken down without touching production. cert-manager issues its own
# certificate; the letsencrypt-prod ClusterIssuer already exists cluster-wide.
#
# DNS: add a Cloudflare A record  bursar.rigorix.eu -> 37.27.25.38  (proxied).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bursar-ingress
  namespace: bursar
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - bursar.rigorix.eu
      secretName: tls-bursar-rigorix-eu
  rules:
    - host: bursar.rigorix.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bursar-frontend
                port:
                  number: 80
