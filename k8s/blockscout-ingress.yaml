---
# Ingress for the Blockscout explorer.
#
# Separate host from bursar.rigorix.eu so the demo app and the explorer get
# independent certificates and can be moved apart later. Same Traefik class and
# letsencrypt-prod issuer as the other ingresses on this cluster.
#
# DNS: add a Cloudflare A record  explorer.bursar.rigorix.eu -> 37.27.25.38  (proxied).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blockscout-ingress
  namespace: bursar
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - explorer.bursar.rigorix.eu
      secretName: tls-explorer-bursar-rigorix-eu
  rules:
    - host: explorer.bursar.rigorix.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blockscout-proxy
                port:
                  number: 80
