---
# Authority service (:8001) — the spend guard / cap ledger / approvals.
# Same image as the console, different entrypoint. Shares the SQLite volume.
#
# The console calls this at BURSAR_PRECONDITION_URL. It must be up before the
# console reports ready, so the console's readiness depends on this via the
# service (kubelet ordering, not a hard dependency — the console retries).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bursar-authority
  namespace: bursar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bursar-authority
  template:
    metadata:
      labels:
        app: bursar-authority
    spec:
      containers:
        - name: authority
          image: bursar-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -a
              [ -f /shared/chain.env ] && . /shared/chain.env
              set +a
              exec uvicorn src.apps.authority_service.app:app --host 0.0.0.0 --port 8001
          ports:
            - containerPort: 8001
          env:
            - name: BURSAR_ENV
              value: prod
            - name: BURSAR_LOG_LEVEL
              value: INFO
            - name: BURSAR_LOG_JSON
              value: "true"
            - name: BURSAR_AUTHORITY_DATABASE_URL
              value: sqlite+aiosqlite:////data/bursar.db
            - name: BURSAR_CONSOLE_DATABASE_URL
              value: sqlite+aiosqlite:////data/bursar.db
            - name: BURSAR_SQLITE_BUSY_TIMEOUT_MS
              value: "5000"
            - name: BURSAR_OWNER_ADDRESS
              value: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
            - name: BURSAR_HOUSEHOLD_ID
              value: demo-household
            - name: BURSAR_CHAIN
              value: anvil
            - name: BURSAR_RPC_URL
              value: http://bursar-anvil:8545
            - name: BURSAR_CHAIN_ID
              value: "31337"
            - name: BURSAR_CONFIRMATIONS_REQUIRED
              value: "1"
            - name: BURSAR_DAILY_CAP_USDC
              value: "150"
            - name: BURSAR_PER_PAYMENT_THRESHOLD_USDC
              value: "25"
            - name: BURSAR_SETTLEMENT_BUDGET_USDC
              value: "20"
            - name: BURSAR_ANCHOR_MODE
              value: per_envelope
            - name: BURSAR_PRECONDITION_URL
              value: http://bursar-authority:8001/v1/precondition/check
            - name: BURSAR_PRECONDITION_TIMEOUT_SECONDS
              value: "5"
            # Single-database demo deployment: both deployables share bursar.db so the
            # authority can read Billing's attempt/invoice rows in the same transaction.
            # Requires BURSAR_BILLING_READ_MODE=shared (see router.build_services).
            - name: BURSAR_BILLING_READ_MODE
              value: shared
            - name: BURSAR_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: bursar-secrets
                  key: BURSAR_HMAC_KEY
            - name: BURSAR_SETTLEMENT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: bursar-secrets
                  key: BURSAR_SETTLEMENT_PRIVATE_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shared
              mountPath: /shared
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bursar-data
        - name: shared
          persistentVolumeClaim:
            claimName: bursar-data

---
apiVersion: v1
kind: Service
metadata:
  name: bursar-authority
  namespace: bursar
spec:
  selector:
    app: bursar-authority
  ports:
    - port: 8001
      targetPort: 8001
