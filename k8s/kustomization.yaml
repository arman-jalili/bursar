apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bursar

resources:
  - namespace.yaml
  - secret.yaml
  - pvc.yaml
  - anvil.yaml
  - contracts.yaml
  - authority.yaml
  - console.yaml
  - frontend.yaml
  - ingress.yaml

# Secrets are applied from here so a fresh cluster comes up in one command:
#   kubectl apply -k k8s/
#
# The OpenRouter key is created out-of-band (never committed):
#   kubectl create secret generic bursar-llm -n bursar \
#     --from-literal=LLM_API_KEY=sk-or-v1-...
#
# Images are built and imported locally (see k8s/build.sh):
#   bursar-backend:latest   (backend/Dockerfile)
#   bursar-frontend:latest  (frontend/Dockerfile, VITE_CONSOLE_API_URL=/api)
