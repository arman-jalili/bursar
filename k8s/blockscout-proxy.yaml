---
# Blockscout runs as docker compose on this host (explorer/blockscout/compose.vps.yml),
# published on the docker bridge gateway 172.17.0.1:4010 — the same upstream-compose setup
# that works on a dev machine, so the image needs no patching.
#
# Do NOT point this at the node's public IP or 127.0.0.1: pods cannot reach either.
# k3s's Traefik needs an in-cluster Service to route to, so a headless Service plus a
# hand-written Endpoints object bridges to the compose-published docker0 address.
apiVersion: v1
kind: Service
metadata:
  name: blockscout-proxy
  namespace: bursar
spec:
  ports:
    - port: 80
      targetPort: 4010
---
apiVersion: v1
kind: Endpoints
metadata:
  name: blockscout-proxy
  namespace: bursar
subsets:
  - addresses:
      - ip: 172.17.0.1
    ports:
      - port: 4010
