# Bursar on k3s — the core demo stack.
#
#   kubectl apply -f deploy/k8s/bursar.yaml
#
# Prerequisites (see deploy/k8s/README.md):
#   * images built and available to the cluster (bursar-backend:dev, bursar-frontend:dev,
#     bursar-rigorix:dev)
#   * ConfigMap `bursar-env` from .env.demo  (kubectl create configmap --from-env-file)
#   * Secret    `bursar-llm` with BURSAR_LLM_API_KEY
#
# Single-node assumption: the SQLite file, the audit tree and the precondition authority are
# ReadWriteOnce PVCs shared by pods on the same node. That is the k3s demo shape; a multi-node
# deployment needs a clustered filesystem (or the per-deployable databases ADR-002 describes).
apiVersion: v1
kind: Namespace
metadata:
  name: bursar
---
# The operator's dispatch authority and the check Rigorix runs. The console seeds this volume from
# the ConfigMap on first start and then owns authority.json; Rigorix only reads it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bursar-preconditions
  namespace: bursar
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bursar-precondition
  namespace: bursar
data:
  check-approval.py: |
    #!/usr/bin/env python3
    """Does this intent carry the owner's signature when the amount is above the line?"""
    import json
    import sys
    import urllib.request
    from pathlib import Path

    def fail(message):
        print(f"precondition: {message}", file=sys.stderr)
        sys.exit(4)

    def gate():
        try:
            return json.loads((Path(__file__).resolve().parent / "gate.json").read_text())
        except Exception:
            fail("no readable gate.json — refusing (fail closed)")

    def params():
        try:
            payload = json.load(sys.stdin)
        except Exception:
            fail("no stdin — refusing (fail closed)")
        return payload.get("parameters") or {}

    def call(method, path, body=None):
        conf = gate()
        data = None if body is None else json.dumps(body).encode()
        request = urllib.request.Request(
            f"{conf['base_url'].rstrip('/')}{path}",
            data=data,
            method=method,
            headers={
                "authorization": f"Bearer {conf.get('token', '')}",
                "content-type": "application/json",
            },
        )
        try:
            with urllib.request.urlopen(request, timeout=5) as response:
                return json.loads(response.read().decode())
        except Exception as exc:
            fail(f"the gate's ledger did not answer ({exc}) — refusing (fail closed)")

    p = params()
    intent_id = str(p.get("intent_id") or "")
    if not intent_id:
        fail("no intent_id on the step — refusing (fail closed)")

    answer = call("GET", f"/v1/gate/approval/{intent_id}")
    if answer.get("granted"):
        print("precondition: approval valid", file=sys.stderr)
        sys.exit(0)
    print("precondition: the owner's approval is required", file=sys.stderr)
    sys.exit(3)
  check-capacity.py: |
    #!/usr/bin/env python3
    """Does this payment still fit today's cap? If it does, the claim reserves it."""
    import json
    import sys
    import urllib.request
    from pathlib import Path

    def fail(message):
        print(f"precondition: {message}", file=sys.stderr)
        sys.exit(4)

    def gate():
        try:
            return json.loads((Path(__file__).resolve().parent / "gate.json").read_text())
        except Exception:
            fail("no readable gate.json — refusing (fail closed)")

    def params():
        try:
            payload = json.load(sys.stdin)
        except Exception:
            fail("no stdin — refusing (fail closed)")
        return payload.get("parameters") or {}

    def call(method, path, body=None):
        conf = gate()
        data = None if body is None else json.dumps(body).encode()
        request = urllib.request.Request(
            f"{conf['base_url'].rstrip('/')}{path}",
            data=data,
            method=method,
            headers={
                "authorization": f"Bearer {conf.get('token', '')}",
                "content-type": "application/json",
            },
        )
        try:
            with urllib.request.urlopen(request, timeout=5) as response:
                return json.loads(response.read().decode())
        except Exception as exc:
            fail(f"the gate's ledger did not answer ({exc}) — refusing (fail closed)")

    p = params()
    intent_id = str(p.get("intent_id") or "")
    try:
        amount = int(p.get("amount_micro_usdc") or 0)
    except (TypeError, ValueError):
        amount = 0
    if not intent_id or amount <= 0:
        fail("no intent_id or amount_micro_usdc on the step — refusing (fail closed)")

    answer = call(
        "POST",
        "/v1/gate/capacity",
        {"intent_id": intent_id, "amount_micro_usdc": amount},
    )
    if answer.get("allowed"):
        print(
            f"precondition: {amount} fits, {answer.get('headroom_micro_usdc')} still free",
            file=sys.stderr,
        )
        sys.exit(0)
    print(
        f"precondition: {amount} exceeds the {answer.get('cap_micro_usdc')} cap, "
        f"{answer.get('headroom_micro_usdc')} free",
        file=sys.stderr,
    )
    sys.exit(3)
  check-payee.py: |
    #!/usr/bin/env python3
    """Is this payee allowed to be paid right now? (the operator's freeze file)"""
    import json
    import sys
    from pathlib import Path

    try:
        payload = json.load(sys.stdin)
    except Exception:
        print("precondition: no stdin — refusing (fail closed)", file=sys.stderr)
        sys.exit(4)

    address = str((payload.get("parameters") or {}).get("payee_address") or "").lower()
    if not address:
        print("precondition: no payee_address on the step — refusing (fail closed)", file=sys.stderr)
        sys.exit(4)

    try:
        authority = json.loads((Path(__file__).resolve().parent / "authority.json").read_text())
    except Exception:
        print("precondition: no readable authority.json — refusing (fail closed)", file=sys.stderr)
        sys.exit(4)

    status = authority.get(address, "unknown")
    print(f"precondition: {address} is {status}", file=sys.stderr)
    sys.exit(0 if status == "active" else 3)
  preconditions.toml: |
    # Order matters: an approval refusal must not reserve capacity, and a payee refusal must not
    # either. All three fail closed.
    [[preconditions]]
    id = "approval-valid"
    match = { tool = "run_command", params = [{ pointer = "/command", kind = "glob", value = "*payments.broadcast*" }] }
    require_params = ["/command", "/intent_id"]
    command = ["python3", "/tmp/bursar-preconditions/check-approval.py"]
    timeout_ms = 5000
    failure = "deny"
    authority_path = "/tmp/bursar-preconditions/gate.json"

    [[preconditions]]
    id = "payee-authorized"
    match = { tool = "run_command", params = [{ pointer = "/command", kind = "glob", value = "*payments.broadcast*" }] }
    require_params = ["/command", "/payee_address"]
    command = ["python3", "/tmp/bursar-preconditions/check-payee.py"]
    timeout_ms = 5000
    failure = "deny"
    authority_path = "/tmp/bursar-preconditions/authority.json"

    [[preconditions]]
    id = "capacity-available"
    match = { tool = "run_command", params = [{ pointer = "/command", kind = "glob", value = "*payments.broadcast*" }] }
    require_params = ["/command", "/intent_id", "/amount_micro_usdc"]
    command = ["python3", "/tmp/bursar-preconditions/check-capacity.py"]
    timeout_ms = 5000
    failure = "deny"
    authority_path = "/tmp/bursar-preconditions/gate.json"
  gate.json: |
    {
      "base_url": "http://authority:8001",
      "token": "demo-owner-token"
    }
  authority.json: |
    {
      "0x3c44cdddb6a900fa2b585dd299e03d12fa4293bc": "active",
      "0x15d34aaf54267db7d7c367839aaf71a00a2c6a65": "active",
      "0x90f79bf6eb2c4f870365e785982e1f101e93b906": "active",
      "0x9965507d1a55bcc2695c58ba16fb37d819b0a4dc": "active"
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bursar-data
  namespace: bursar
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bursar-shared
  namespace: bursar
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bursar-audit
  namespace: bursar
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
# ── chain ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvil
  namespace: bursar
spec:
  replicas: 1
  selector:
    matchLabels: { app: anvil }
  template:
    metadata:
      labels: { app: anvil }
    spec:
      containers:
        - name: anvil
          image: ghcr.io/foundry-rs/foundry:stable
          args: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--block-time", "1"]
          env:
            - { name: ANVIL_IP_ADDR, value: "0.0.0.0" }
          ports:
            - { name: rpc, containerPort: 8545 }
          readinessProbe:
            exec:
              command: ["cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: anvil
  namespace: bursar
spec:
  selector: { app: anvil }
  ports:
    - { name: rpc, port: 8545, targetPort: rpc }
---
---
# The Blockscout compose stack runs on the host, so it needs a route to the chain that does not
# go through cluster DNS. The Service above stays ClusterIP for in-cluster callers; this exposes
# the same pods on a node port for the host only. No Ingress rule points at it, so it is never
# publicly routed.
apiVersion: v1
kind: Service
metadata:
  name: anvil-host
  namespace: bursar
spec:
  type: NodePort
  selector: { app: anvil }
  ports:
    - { name: rpc, port: 8545, targetPort: rpc, nodePort: 30545 }
---
# One-shot: deploy TestUsdc + PaymentRouter and write /shared/chain.env.
apiVersion: batch/v1
kind: Job
metadata:
  name: contracts
  namespace: bursar
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-anvil
          image: bursar-backend:dev
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until curl -fsS -H 'content-type: application/json'
              -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
              http://anvil:8545 >/dev/null; do sleep 2; done
      containers:
        - name: deploy
          image: bursar-backend:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/deploy_contracts.py"]
          envFrom:
            - configMapRef: { name: bursar-env }
          volumeMounts:
            - { name: shared, mountPath: /shared }
      volumes:
        - name: shared
          persistentVolumeClaim: { claimName: bursar-shared }
---
# ── enforcement ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authority
  namespace: bursar
spec:
  replicas: 1
  selector:
    matchLabels: { app: authority }
  template:
    metadata:
      labels: { app: authority }
    spec:
      initContainers:
        - name: wait-chain
          image: busybox:1.36
          command: ["sh", "-c", "until [ -f /shared/chain.env ]; do sleep 2; done"]
          volumeMounts:
            - { name: shared, mountPath: /shared, readOnly: true }
      containers:
        - name: authority
          image: bursar-backend:dev
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              set -a; . /shared/chain.env 2>/dev/null || true; set +a;
              exec uvicorn src.apps.authority_service.app:app --host 0.0.0.0 --port 8001
          envFrom:
            - configMapRef: { name: bursar-env }
          ports:
            - { name: http, containerPort: 8001 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: shared, mountPath: /shared, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: bursar-data }
        - name: shared
          persistentVolumeClaim: { claimName: bursar-shared }
---
apiVersion: v1
kind: Service
metadata:
  name: authority
  namespace: bursar
spec:
  selector: { app: authority }
  ports:
    - { name: http, port: 8001, targetPort: http }
---
# ── governed execution host ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rigorix
  namespace: bursar
spec:
  replicas: 1
  selector:
    matchLabels: { app: rigorix }
  template:
    metadata:
      labels: { app: rigorix }
    spec:
      initContainers:
        # Seed the check + authority onto the shared volume (the console usually wins the race).
        - name: seed-precondition
          image: busybox:1.36
          command:
            - sh
            - -c
            - for f in check-approval.py check-capacity.py check-payee.py gate.json authority.json; do cp -n "/seed/$f" "/pre/$f"; done; true
          volumeMounts:
            - { name: seed, mountPath: /seed, readOnly: true }
            - { name: preconditions, mountPath: /pre }
      containers:
        - name: rigorix
          image: bursar-rigorix:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: bursar-env }
          env:
            - { name: RIGORIX_SERVER_BIND, value: "0.0.0.0:3001" }
            - { name: RIGORIX_SANDBOX, value: "container" }
            - { name: RIGORIX_HMAC_KEY, value: "bursar-demo-operator-held-evidence-key-4c1f9a" }
            - { name: RIGORIX_REPO_ROOT, value: "/workspace" }
          ports:
            - { name: rpc, containerPort: 3001 }
          readinessProbe:
            httpGet: { path: /health, port: rpc }
            periodSeconds: 3
          volumeMounts:
            - { name: audit, mountPath: /workspace/.rigorix }
            - name: preconditions-toml
              mountPath: /workspace/.rigorix/preconditions.toml
              subPath: preconditions.toml
            - { name: preconditions, mountPath: /tmp/bursar-preconditions, readOnly: true }
      volumes:
        - name: audit
          persistentVolumeClaim: { claimName: bursar-audit }
        - name: preconditions
          persistentVolumeClaim: { claimName: bursar-preconditions }
        - name: preconditions-toml
          configMap:
            name: bursar-precondition
            items:
              - { key: preconditions.toml, path: preconditions.toml }
        - name: seed
          configMap:
            name: bursar-precondition
            items:
              - { key: check-approval.py, path: check-approval.py }
              - { key: check-capacity.py, path: check-capacity.py }
              - { key: check-payee.py, path: check-payee.py }
              - { key: gate.json, path: gate.json }
              - { key: authority.json, path: authority.json }
---
apiVersion: v1
kind: Service
metadata:
  name: rigorix
  namespace: bursar
spec:
  selector: { app: rigorix }
  ports:
    - { name: rpc, port: 3001, targetPort: rpc }
---
# ── console + agent ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: bursar
spec:
  replicas: 1
  selector:
    matchLabels: { app: console }
  template:
    metadata:
      labels: { app: console }
    spec:
      initContainers:
        - name: wait-chain
          image: busybox:1.36
          command: ["sh", "-c", "until [ -f /shared/chain.env ]; do sleep 2; done"]
          volumeMounts:
            - { name: shared, mountPath: /shared, readOnly: true }
        - name: seed-precondition
          image: busybox:1.36
          command:
            - sh
            - -c
            - for f in check-approval.py check-capacity.py check-payee.py gate.json authority.json; do cp -n "/seed/$f" "/pre/$f"; done; true
          volumeMounts:
            - { name: seed, mountPath: /seed, readOnly: true }
            - { name: preconditions, mountPath: /pre }
      containers:
        - name: console
          image: bursar-backend:dev
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              set -a; . /shared/chain.env 2>/dev/null || true; set +a;
              exec uvicorn src.apps.console_api.app:app --host 0.0.0.0 --port 8000
          envFrom:
            - configMapRef: { name: bursar-env }
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: bursar-llm, key: BURSAR_LLM_API_KEY }
            - { name: LLM_BASE_URL, value: "https://openrouter.ai/api/v1" }
            - { name: LLM_MODEL, value: "nvidia/nemotron-3.5-lightning:free" }
            - { name: LLM_FALLBACK_MODEL, value: "inclusionai/ling-3.2-flash:free" }
            # In-cluster service DNS, never host.docker.internal.
            - { name: BURSAR_RIGORIX_BASE_URL, value: "http://rigorix:3001" }
            - { name: RIGORIX_AUDIT_DIR, value: "/rigorix-audit" }
            - { name: BURSAR_PRECONDITION_DIR, value: "/tmp/bursar-preconditions" }
            # The page's public origin, for CORS (edit to the ingress host).
            - { name: BURSAR_CORS_ORIGINS, value: "https://bursar.rigorix.eu" }
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: shared, mountPath: /shared, readOnly: true }
            # Rigorix writes signed envelopes to <volume>/audit/ and execution state to
            # <volume>/state/, so the console must mount that subdirectory — not the volume root,
            # which holds no envelopes. Compose mounts
            # ./.rigorix-runtime/.rigorix/audit -> /rigorix-audit for the same reason. Mounting the
            # root left only /rigorix-audit/state/*.json, which the trail endpoint and the
            # per-execution envelope route never globbed, so the UI showed no trail at all.
            - { name: audit, mountPath: /rigorix-audit, subPath: audit }
            - { name: preconditions, mountPath: /tmp/bursar-preconditions }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: bursar-data }
        - name: shared
          persistentVolumeClaim: { claimName: bursar-shared }
        - name: audit
          persistentVolumeClaim: { claimName: bursar-audit }
        - name: preconditions
          persistentVolumeClaim: { claimName: bursar-preconditions }
        - name: seed
          configMap:
            name: bursar-precondition
            items:
              - { key: check-approval.py, path: check-approval.py }
              - { key: check-capacity.py, path: check-capacity.py }
              - { key: check-payee.py, path: check-payee.py }
              - { key: gate.json, path: gate.json }
              - { key: authority.json, path: authority.json }
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: bursar
spec:
  selector: { app: console }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
# ── UI ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bursar
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: bursar-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bursar
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
---
---
# One host, /api -> console. The deployed variant of the upstream placeholder ingress.
#
# A second host (api.bursar.example.com upstream) is not usable as written here: Cloudflare's
# free Universal SSL covers *.rigorix.eu — one label — so api.bursar.rigorix.eu gets no
# certificate and the TLS handshake fails at the edge. The prefix is stripped by nginx in the
# frontend image instead, which also keeps the browser same-origin (no CORS preflight).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bursar
  namespace: bursar
spec:
  ingressClassName: traefik
  tls:
    - hosts: [bursar.rigorix.eu]
      secretName: tls-bursar-rigorix-eu
  rules:
    - host: bursar.rigorix.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
