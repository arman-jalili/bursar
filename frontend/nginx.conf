server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html references content-hashed assets; it must never be cached, or a refresh after a
    # rebuild asks for a chunk the new build no longer has (and gets index.html with a text/html
    # MIME type). Hashed assets below can be cached hard.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The SPA is built with VITE_CONSOLE_API_URL=/api and the console serves /v1/..., so nginx
    # strips the prefix. Same-origin: no CORS preflight and the owner token never crosses hosts.
    # This mirrors what the api.bursar host would do at the ingress, for a host whose Cloudflare
    # certificate exists (a two-label name has none on the free plan).
    location /api/ {
        # `console` resolves in both placements: the compose service name and the k8s Service in
        # this namespace. The fully-qualified cluster name fails nginx startup under Docker.
        proxy_pass http://console:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
