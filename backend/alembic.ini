# Alembic configuration — migration tooling only (ADR-002).
#
# Phase 0 wires the toolchain and creates NO module tables. Each bounded context adds its own
# revision in its build phase (`001_mandate`, `002_billing`, `003_authority`, `004_settlement`,
# `005_evidence`, `006_console`).
#
# The database URL is NOT set here: it is resolved from Settings in migrations/env.py, because
# there are two databases (authority + console) and a hardcoded URL in this file would silently
# migrate the wrong one.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Revision file naming: NNN_slug, matching the roadmap's migration names.
file_template = %%(rev)s_%%(slug)s
# Database selector: -x db=authority | -x db=console (default: console)
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
