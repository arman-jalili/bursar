# CI — the same gates a reviewer runs locally (`make check` + `make validate`).
#
# Canonical: docs/architecture/implementation-roadmap.md#phase-0-project-bootstrap-hours-01
# Reference: docs/architecture/decisions/ADR-001-architecture-pattern.md
#
# Two jobs on purpose: `quality` fails fast on lint/types/tests; `architecture` enforces the ADR
# gates. Keeping them separate means a red architecture job is never mistaken for a red test.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest --maxfail=1

  architecture:
    name: Architecture gates (ADR-001/002/007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Domain layer must stay framework-free
        run: |
          if grep -rEl '^\s*(import|from)\s+(fastapi|sqlalchemy|flask|django)' src/*/domain/*.py src/shared/domain/*.py 2>/dev/null; then
            echo "✗ domain layer imports a framework"; exit 1
          fi
          echo "✓ domain layer is framework-free"

  migrations:
    name: Migrations round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Upgrade and downgrade both databases
        run: |
          for db in authority console; do
            uv run alembic -x db=$db upgrade head
            uv run alembic -x db=$db downgrade base
            echo "✓ $db migrations round-trip"
          done
