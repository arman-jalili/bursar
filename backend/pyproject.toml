[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bursar"
version = "0.1.0"
description = "Bursar — a delegated bill-paying agent for a household, with a machine-enforced constitution and an on-chain second lock."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Proximata Hackathon '26" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    # keccak256 for the settlement nullifier. The EVM's keccak is not hashlib's sha3_256, and the
    # nullifier must equal the value `PaymentRouter.spentNullifiers` computes — a mismatch would be
    # either a duplicate payment or a false refusal (SC-5). eth-hash is the one dependency the
    # settlement contract freeze permits (docs/contracts/settlement-contract-freeze.md §2.2), and it
    # is also the keccak implementation the Phase-B chain adapter will use, so the domain and the
    # adapter agree by construction rather than by coincidence.
    "eth-hash[pycryptodome]>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
authority-service = "src.apps.authority_service.app:main"
console-api = "src.apps.console_api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# `.pi/` holds the Guardian harness (vendored scripts and extensions). Formatting it would create
# noise in every epic diff and rewrite tooling we do not own.
# `.pi/` holds the Guardian harness (vendored scripts and extensions). Formatting it would create
# noise in every epic diff and rewrite tooling we do not own.
# `docs/contracts/` holds frozen contract artifacts. They are evidence, not code: a formatter that
# rewrites them turns a cosmetic pass into a "contracts changed since the freeze" failure. Freezing
# means byte-stable, so the formatter must not touch them.
exclude = [".pi", ".venv", "contracts/lib", "out", "cache", "data", "docs/contracts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
    "N",   # pep8-naming
    "ASYNC",
]
ignore = [
    "E501",  # line length is enforced by the formatter
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["N999", "E402"]
# The TDD generator names test modules after component slugs (`test_aggregate-household.py`), and
# the pipeline's step prompts reference those exact paths. Renaming them would break the handoff,
# so the PEP-8 module-name rule is waived for those files only.
"tests/unit/**/test_*-*.py" = ["N999"]
# The `__init__.py` files that make duplicate suite names importable live in invariant-named directories
# (`domain-services/`, `repository-interfaces-owned-by-domain/`). The directory names are fixed by the
# contract-test layout, so the module-name rule is waived for them — the packages exist to satisfy pytest,
# not to be imported by their path.
"tests/unit/**/*services*/__init__.py" = ["N999"]
"tests/unit/**/repository-interfaces-owned-by-domain/__init__.py" = ["N999"]
"tests/unit/**/layer-purity/__init__.py" = ["N999"]
# Domain refusal names are frozen by the architecture docs and quoted by acceptance criteria
# (`ConstitutionCorrupted` in AC #8, `OwnerProofInvalid` in AC #4). The `-Error` suffix rule loses to
# the ubiquitous language: these are behaviours, not generic exceptions.
"src/mandate/domain/errors.py" = ["N818"]
"src/billing/domain/errors.py" = ["N818"]
"src/authority/domain/errors.py" = ["N818"]
"src/evidence/domain/errors.py" = ["N818"]
"src/settlement/domain/errors.py" = ["N818"]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
files = ["src", "tests"]
# The frozen-contract tests under tests/unit/ deliberately compare types that must not be
# interchangeable (`Cap is not Threshold`) and introspect dataclass internals
# (`__dataclass_params__`, `_vo_kind`) to pin the modelling decisions. Type-checking them would
# flag the assertions themselves, so they are excluded here and covered by pytest instead.
exclude = ['^tests/unit/']

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `importlib` rather than the default `prepend`: contract-test directories are named after invariants
# (`at-most-one-attempt/`, `domain-services/`), and the same suite name recurs across modules. Those
# directories cannot be packages (a hyphen is not a legal identifier, and an `__init__.py` there breaks
# mypy), so `prepend` collides on duplicate basenames — `tests/unit/billing/domain-services/` and
# `tests/unit/authority/domain-services/` both hold `test_domain-services.py`. importlib keys modules by
# path, so the collision disappears without weakening either suite.

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "acceptance: maps to a numbered acceptance criterion in a module doc",
    "contract: architecture-boundary test (ADR-001/002/007)",
]
filterwarnings = ["error::DeprecationWarning:src.*"]